<style>/* ================= ROMELL Planta v3 · sistema de Lucía =================
   Temas (crema · noche · navy · papel), acento, escala (compacta · normal · TV) y animaciones configurables. */
:root{
  --bg:#EFE7DA; --bg2:#E6DBC9; --card:#FBF8F2; --card2:#F4EDE1; --fill:#E7DCC9; --fill2:#D7C7AE;
  --line:rgba(26,27,25,.10); --line2:rgba(26,27,25,.06);
  --ink:#151613; --ink2:#2A2B27; --muted:#5F594E; --taupe:#877A65;
  --acc:#2b673d; --acc2:#3A8452; --acc-t:rgba(43,103,61,.12); --acc-ink:#fff; --acc-soft:#DDEBDF;
  --navy:#1F2A44; --sand:#B99979; --sandlt:#E5D2B6; --aqua:#6FA89C; --gold:#C9A04A; --crit:#B4432F; --warn:#B07A1E; --ok:#2b673d;
  --s-romell:#2b673d; --s-cosme:#1F2A44; --s-xoxtla:#B99979; --s-linea:#6FA89C;
  --side:#151613; --side-ink:#EDE3D3; --side-mut:#A99C86;
  --hero1:#2b673d; --hero2:#1b4a2b;
  --sans:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif; --serif:"Bodoni Moda",Georgia,serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:22px; --r2:15px; --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --io:cubic-bezier(.65,0,.35,1);
  --sh1:0 1px 0 rgba(21,22,19,.04),0 1px 3px rgba(21,22,19,.06);
  --sh2:0 1px 0 rgba(21,22,19,.03),0 14px 34px -18px rgba(21,22,19,.30);
  --sh3:0 2px 0 rgba(21,22,19,.03),0 28px 56px -22px rgba(21,22,19,.42);
  --fs:15px; --gap:14px; color-scheme:light;
}
html[data-tema=noche]{--bg:#121311;--bg2:#1A1B18;--card:#1E201C;--card2:#262823;--fill:#2E302A;--fill2:#3B3E36;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.05);--ink:#F2EDE3;--ink2:#DDD6C9;--muted:#A9A190;--taupe:#958A76;--side:#0B0C0A;--acc-soft:#1F3A27;--s-cosme:#7E93C2;--navy:#7E93C2;color-scheme:dark;--sh2:0 14px 34px -18px rgba(0,0,0,.7);--sh3:0 28px 56px -22px rgba(0,0,0,.85)}
html[data-tema=navy]{--bg:#E4E7EE;--bg2:#D7DCE6;--card:#F7F8FB;--card2:#EDF0F5;--fill:#DCE1EA;--fill2:#C6CEDC;--ink:#111827;--muted:#525B6E;--taupe:#6B7489;--side:#16203A;--side-ink:#E6EAF3;--side-mut:#98A3BC;--hero1:#1F2A44;--hero2:#121a2e}
html[data-tema=papel]{--bg:#F6F5F2;--bg2:#ECEAE5;--card:#FFFFFF;--card2:#F7F6F3;--fill:#ECEAE4;--fill2:#DCD9D1;--side:#1A1B19;--sh2:0 1px 0 rgba(0,0,0,.03),0 10px 26px -16px rgba(0,0,0,.18)}
html[data-acento=navy]{--acc:#1F2A44;--acc2:#2E3C5E;--acc-t:rgba(31,42,68,.12);--acc-soft:#DCE3F0;--hero1:#1F2A44;--hero2:#121a2e}
html[data-acento=arena]{--acc:#9C7A55;--acc2:#B99979;--acc-t:rgba(156,122,85,.15);--acc-soft:#F1E3CF;--hero1:#9C7A55;--hero2:#6E5539}
html[data-acento=negro]{--acc:#1A1B19;--acc2:#3a3b36;--acc-t:rgba(0,0,0,.08);--acc-soft:#E2DED6;--hero1:#2a2b27;--hero2:#0e0f0d}
html[data-acento=vino]{--acc:#7A2335;--acc2:#963247;--acc-t:rgba(122,35,53,.12);--acc-soft:#F2D9DE;--hero1:#7A2335;--hero2:#4f1521}
html[data-tema=noche][data-acento=negro]{--acc:#F2EDE3;--acc-ink:#121311;--hero1:#2a2b27;--hero2:#0e0f0d}
html[data-escala=compacta]{--fs:14px;--gap:10px;--r:18px}
html[data-escala=tv]{--fs:19px;--gap:20px;--r:28px}
html[data-mov=off] *,html[data-mov=off] *::before,html[data-mov=off] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .5s var(--ease),color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(1100px 560px at 88% -12%,var(--acc-t),transparent 62%),radial-gradient(900px 520px at -12% 112%,rgba(31,42,68,.07),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);letter-spacing:-.01em}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
::selection{background:var(--acc-t)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:2px;z-index:20;overflow-y:auto;scrollbar-width:none}
.brand{padding:4px 10px 20px;display:flex;align-items:center;gap:12px}
.brand .mk{width:40px;height:40px;border-radius:13px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 17px var(--sans);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
.brand b{display:block;font-weight:800;letter-spacing:.3em;font-size:14px}
.brand em{font-family:var(--serif);font-style:italic;color:var(--sandlt);font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--side-mut);font-weight:800;margin:14px 12px 6px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:#CFC3AD;text-decoration:none;font-weight:650;font-size:14.5px;transition:background .25s var(--ease),color .25s}
html[data-tema=navy] .nav a{color:#C3CADA}
.nav a svg{transition:transform .4s var(--spring)}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a:hover svg{transform:scale(1.14) rotate(-6deg)}
.nav a.on{background:var(--acc);color:var(--acc-ink);box-shadow:0 10px 22px -12px var(--acc)}
.nav a .k{margin-left:auto;font-size:10.5px;color:var(--side-mut);font-weight:800;opacity:0;transition:opacity .2s}
.nav a:hover .k{opacity:1}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
.who{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;border:0;background:none;color:inherit;text-align:left;width:100%;transition:background .2s}
.who:hover{background:rgba(255,255,255,.06)}
.av{width:36px;height:36px;border-radius:50%;background:var(--sand);color:#1a1b19;display:grid;place-items:center;font-weight:800;flex:none}
.who b{display:block;font-size:13.5px;color:var(--side-ink)}
.who span{font-size:12px;color:var(--side-mut)}
.side .sbtn{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-mut);padding:8px 10px;border-radius:12px;font-weight:700;font-size:13px;transition:background .2s,color .2s}
.side .sbtn:hover{background:rgba(255,255,255,.06);color:#fff}
main{min-width:0;padding:22px clamp(16px,3vw,42px) 130px;view-transition-name:main}

/* ---------- encabezado ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top .tt{min-width:0;flex:1 1 320px;display:flex;gap:16px;align-items:center}
.top h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.6vw,46px);line-height:1.04;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.top h1 em{color:var(--acc)}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:750;color:var(--muted);background:var(--card);border-radius:99px;padding:8px 13px;box-shadow:var(--sh1);border:0;white-space:nowrap;transition:transform .25s var(--spring),box-shadow .25s}
.pill:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.pill i.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
.pill.warn i.dot{background:var(--warn);animation:none}
.pill .i{width:16px;height:16px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,103,61,.45)}70%{box-shadow:0 0 0 9px rgba(43,103,61,0)}100%{box-shadow:0 0 0 0 rgba(43,103,61,0)}}
.kbd{font:700 11px var(--sans);background:var(--fill);border-radius:6px;padding:2px 6px;color:var(--muted)}
/* fecha nueva: ficha de calendario */
.cal{display:inline-grid;grid-template-rows:auto 1fr;width:58px;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--sh2);text-align:center;flex:none;transform:rotate(-3deg);transition:transform .4s var(--spring)}
.cal:hover{transform:rotate(0) scale(1.05)}
.cal span{background:var(--acc);color:var(--acc-ink);font:800 10.5px var(--sans);letter-spacing:.18em;padding:3px 0 2px;padding-left:.18em}
.cal b{font:500 28px/1.15 var(--serif);padding:2px 0 4px}
.fch{display:inline-flex;align-items:baseline;gap:6px;font-weight:750}
.fch b{font-family:var(--serif);font-weight:500;font-size:1.1em}
.fch small{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:800}

/* ---------- animaciones de entrada ---------- */
.rise{animation:rise .65s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(3px)}}
.quiet .rise,.quiet .grow,.quiet .growx,.quiet .draw{animation:none!important}
::view-transition-old(main){animation:vt-out .2s ease both}
::view-transition-new(main){animation:vt-in .5s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:scale(.99);filter:blur(2px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}

/* ---------- rejillas y tarjetas ---------- */
.grid{display:grid;gap:var(--gap)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.sec{margin-top:var(--gap)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh2);min-width:0;position:relative;container-type:inline-size;transition:transform .45s var(--ease),box-shadow .45s var(--ease),background .4s}
.card.hov:hover{transform:translateY(-3px);box-shadow:var(--sh3)}
.card h2,.h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--taupe);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.card h2 .x2,.h2 .x2{letter-spacing:0;text-transform:none;font-weight:700;color:var(--muted)}
.lnk{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--acc);background:none;border:0;font-weight:800;padding:5px 9px;border-radius:9px;text-decoration:none;transition:background .2s}
.lnk:hover{background:var(--acc-t)}
.kpi{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh2);position:relative;overflow:hidden;container-type:inline-size;min-width:0;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh3)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:clamp(20px,11cqi,36px);font-weight:800;letter-spacing:-.025em;margin-top:4px;white-space:nowrap;line-height:1.1}
.kpi .v small{font-size:.42em;font-weight:750;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .d{font-size:12.5px;margin-top:5px;font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.kpi.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.kpi.dark{background:linear-gradient(135deg,#1c1d19,#2b2c27);color:#EDE3D3}
.kpi.navy{background:linear-gradient(135deg,#1f2a44,#2d3b5d);color:#EDE3D3}
.kpi.hero .l,.kpi.hero .v small,.kpi.hero .d,.kpi.dark .l,.kpi.dark .v small,.kpi.dark .d,.kpi.navy .l,.kpi.navy .v small,.kpi.navy .d{color:rgba(255,255,255,.75)}
.kpi::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 140px at var(--mx,50%) -25%,rgba(255,255,255,.22),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.kpi:hover::after{opacity:1}
.up{color:var(--ok)}.down{color:var(--crit)}
.kpi.hero .up,.kpi.dark .up,.kpi.navy .up{color:#9BE3A8}.kpi.hero .down,.kpi.dark .down,.kpi.navy .down{color:#F5B3A3}
button.kpi{border:0;text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer}
/* inclinación 3D al pasar el cursor */
.tilt{transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.tilt:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px);box-shadow:var(--sh3)}

/* ---------- controles ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--sh1);min-height:46px;border:1px solid transparent;transition:border-color .2s,box-shadow .2s;min-width:0}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-t)}
.search svg{color:var(--taupe)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;padding:11px 0;font-size:15px}
.search .x{border:0;background:var(--fill);border-radius:50%;width:24px;height:24px;line-height:1;font-size:16px;color:var(--muted);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroller{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.scroller::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);border-radius:99px;padding:8px 13px;font-weight:750;font-size:13px;box-shadow:var(--sh1);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .3s var(--spring),background .2s,color .2s,box-shadow .2s}
.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip small{font-weight:650;color:var(--muted)}
.chip.on small{color:inherit;opacity:.7}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.seg{display:inline-flex;background:var(--fill);border-radius:13px;padding:3px;position:relative;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--muted);position:relative;z-index:1;transition:color .25s;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;border-radius:10px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:left .45s var(--spring),width .45s var(--spring),top .3s,height .3s;pointer-events:none}
.btn{border:0;border-radius:15px;padding:12px 18px;font-weight:800;background:var(--acc);color:var(--acc-ink);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;position:relative;overflow:hidden;white-space:nowrap;transition:transform .3s var(--spring),box-shadow .3s,background .2s,opacity .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px var(--acc)}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}.btn.ghost:hover{box-shadow:var(--sh2)}
.btn.soft{background:var(--acc-t);color:var(--acc)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn.big{font-size:17px;padding:16px 22px;width:100%;min-height:56px;border-radius:18px}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ibtn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--sh1);flex:none;transition:transform .35s var(--spring),box-shadow .2s}
.ibtn:hover{transform:scale(1.08);box-shadow:var(--sh2)}
.fld{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-height:46px;width:100%;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.fld:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-t)}
textarea.fld{min-height:90px;resize:vertical}
label.f{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0 5px}
input[type=range]{width:100%;accent-color:var(--acc)}
.tog{position:relative;width:46px;height:28px;flex:none}
.tog input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.tog i{position:absolute;inset:0;background:var(--fill2);border-radius:99px;transition:background .3s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.tog input:checked+i{background:var(--acc)}
.tog input:checked+i::after{transform:translateX(18px)}

/* ---------- gráficas ---------- */
.chart{width:100%;height:auto;display:block;overflow:hidden}
.chart.hasb,.chart.ac{overflow:visible}
.wrapc{padding-top:4px}
.chart text{font:650 calc(var(--fs) * .74) var(--sans);fill:var(--muted)}
.chart .grid line{stroke:var(--line)}
.wrapc{position:relative;overflow-x:auto;overflow-y:visible;scrollbar-width:thin}
/* barras con silueta 3D al pasar el cursor */
.b3 .fr{transition:transform .45s var(--spring),filter .3s}
.b3 .sd,.b3 .tp{opacity:0;transition:opacity .35s var(--ease),transform .45s var(--spring)}
.b3 .sd{transform:translate(-5px,5px)}.b3 .tp{transform:translate(-5px,5px)}
.b3{cursor:pointer;transition:opacity .25s}
.chart.hasb:hover .b3{opacity:.55}
.chart.hasb .b3:hover,.chart.hasb .b3.on{opacity:1}
.b3:hover .fr,.b3.on .fr{transform:translate(-4px,-4px);filter:drop-shadow(6px 10px 10px rgba(0,0,0,.28))}
.b3:hover .sd,.b3:hover .tp,.b3.on .sd,.b3.on .tp{opacity:1;transform:translate(-4px,-4px)}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes grow{from{transform:scaleY(0)}}
.growx{transform-origin:left;animation:growx 1s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes growx{from{transform:scaleX(0)}}
.draw{stroke-dasharray:var(--L,3000);stroke-dashoffset:var(--L,3000);animation:draw 1.6s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{animation:fadein 1.2s var(--ease) .35s both}
@keyframes fadein{from{opacity:0}}
.xh{pointer-events:none;opacity:0;transition:opacity .15s}
.ac:hover .xh,.ac.act .xh{opacity:1}
.xh line{stroke:var(--ink);stroke-opacity:.25;stroke-dasharray:3 4}
.xh circle{stroke:var(--card);stroke-width:2.5;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend button,.legend span{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:6px;color:inherit;font-weight:700;transition:opacity .2s}
.legend button.off{opacity:.35;text-decoration:line-through}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.legend i.ln{height:3px;width:16px;border-radius:2px}
.tip{position:fixed;z-index:95;pointer-events:none;background:rgba(21,22,19,.94);color:#fff;border-radius:13px;padding:10px 13px;font-size:12.5px;box-shadow:0 16px 34px -12px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,calc(-100% - 10px)) scale(.94);transition:opacity .15s,transform .2s var(--ease);max-width:280px;backdrop-filter:blur(6px)}
.tip.on{opacity:1;transform:translate(-50%,calc(-100% - 14px)) scale(1)}
.tip.abajo{transform:translate(-50%,0) scale(.94)}.tip.abajo.on{transform:translate(-50%,0) scale(1)}
.cslot{width:100%;min-width:0}
.tip b{display:block;font-size:13.5px;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:16px;align-items:center}
.tip .r i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
/* barras horizontales */
.hbars .row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px;padding:7px 8px;margin:0 -8px;border-radius:12px;cursor:pointer;transition:background .25s,transform .35s var(--spring),box-shadow .35s}
.hbars .row:hover{background:var(--card2);transform:translateX(3px)}
.hbars .row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;display:flex;align-items:center;gap:8px;min-width:0}
.hbars .track{height:12px;background:var(--fill);border-radius:99px;overflow:hidden;display:flex;transition:height .3s var(--spring),box-shadow .3s}
.hbars .row:hover .track{height:16px;box-shadow:0 6px 12px -6px rgba(0,0,0,.35)}
.hbars .track i{display:block;height:100%}
.hbars .row b{text-align:right;font-weight:800;white-space:nowrap}
/* dona */
.ring{display:flex;gap:18px;align-items:center}
.ring svg{flex:none;overflow:visible}
.ring .seg2{transition:transform .45s var(--spring),filter .3s,opacity .25s;cursor:pointer;transform-origin:80px 80px}
.ring svg:hover .seg2{opacity:.55}
.ring .seg2:hover,.ring .seg2.on{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1.04);filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.ring .lg{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1;min-width:0}
.ring .lg button{all:unset;cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;transition:background .2s,transform .3s var(--spring)}
.ring .lg button:hover{background:var(--card2);transform:translateX(3px)}
.ring .lg i{width:12px;height:12px;border-radius:4px}
.ring .ctr text{transition:opacity .2s}
@container (max-width:430px){.ring{flex-direction:column;align-items:stretch}.ring svg{align-self:center}}
.spark{display:block;width:100%;height:42px;overflow:hidden}

/* ---------- tablas ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:2;user-select:none}
.tbl th[data-act]{cursor:pointer}.tbl th[data-act]:hover{color:var(--ink)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl td b{font-weight:750}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--acc-t)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.sel{background:var(--acc-t)}
.tbl .cb{width:18px;height:18px;accent-color:var(--acc)}
.tblwrap{overflow:auto;max-height:calc(100vh - 290px);border-radius:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--fill);color:var(--muted);white-space:nowrap}
.tag.g{background:var(--acc-soft);color:var(--acc)}.tag.n{background:#DCE3F0;color:#1F2A44}.tag.s{background:#F1E3CF;color:#7B5520}.tag.r{background:#F5D9D2;color:var(--crit)}.tag.a{background:#D7ECE8;color:#2f6d62}
html[data-tema=noche] .tag.n{background:#253049;color:#BFCBE6}html[data-tema=noche] .tag.s{background:#3a2f22;color:#E5C9A2}html[data-tema=noche] .tag.r{background:#432620;color:#F2B1A2}html[data-tema=noche] .tag.a{background:#1f3a35;color:#A6DCD2}
.empty{text-align:center;color:var(--muted);padding:38px 16px}
.empty svg{width:42px;height:42px;display:block;margin:0 auto 10px;color:var(--taupe)}
.pager{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:10px 4px 2px;font-size:13px;color:var(--muted);flex-wrap:wrap}
/* pivote */
.pv{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.pv thead th{position:sticky;top:0;z-index:3;background:var(--card);text-align:right;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:800;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.pv thead th:first-child{text-align:left;position:sticky;left:0;z-index:4}
.pv thead th.on{color:var(--ink)}
.pv td{padding:0;border-bottom:1px solid var(--line2)}
.pv td:first-child{position:sticky;left:0;background:inherit;z-index:1;max-width:46vw}
.pv td>div{padding:10px 12px}
.pv td.r>div{text-align:right}
.pv tr{background:var(--card);transition:background .15s}
.pv tr.l0>td:first-child>div{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;min-width:0}
.pv tr.l1>td:first-child>div{padding-left:36px;font-weight:700;display:flex;gap:8px;align-items:center}
.pv tr.l2>td:first-child>div{padding-left:60px;color:var(--muted);font-weight:650}
.pv tbody tr:hover{background:var(--card2)}
.pv .tg{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--fill);transition:transform .4s var(--spring),background .2s;border:0;padding:0;flex:none}
.pv .tg svg{width:12px;height:12px;stroke-width:2.6}
.pv tr.open>td:first-child .tg{transform:rotate(90deg);background:var(--acc);color:var(--acc-ink)}
.pv .cell{cursor:pointer;position:relative;border-radius:10px;transition:background .2s,transform .3s var(--spring)}
.pv .cell:hover{background:var(--acc-t);transform:scale(1.04)}
.pv .cell .mb{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px;background:var(--fill);overflow:hidden}
.pv .cell .mb i{display:block;height:100%}
.pv .tot{font-weight:800}
.pv .n{display:block;font-size:11px;color:var(--taupe);font-weight:650}
.pv tr.kids{animation:kid .4s var(--ease) both}
@keyframes kid{from{opacity:0;transform:translateY(-6px)}}
.pv tfoot td{background:var(--card2);position:sticky;bottom:0}
.pvwrap{overflow:auto;max-height:calc(100vh - 250px);border-radius:var(--r)}

/* ---------- hojas: panel lateral, ajustes, IA ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,11,9,.42);z-index:70;opacity:0;transition:opacity .35s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--bg);z-index:71;box-shadow:-30px 0 60px -30px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .55s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer.wide{width:min(760px,100vw)}
.drawer header{padding:20px 22px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer header h3{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.drawer header .s{color:var(--muted);font-size:13px;margin-top:4px}
.drawer .body{overflow:auto;padding:0 22px 28px;flex:1}
.drawer .body>*{animation:rise .5s var(--ease) both}
.drawer .body>*:nth-child(2){animation-delay:.05s}.drawer .body>*:nth-child(3){animation-delay:.1s}.drawer .body>*:nth-child(4){animation-delay:.15s}.drawer .body>*:nth-child(n+5){animation-delay:.2s}
.x-btn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:20px;box-shadow:var(--sh1);flex:none;transition:transform .4s var(--spring)}
.x-btn:hover{transform:rotate(90deg)}
.list .row{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);font-size:13.5px;transition:background .2s;align-items:center}
.list .row>*{min-width:0}
.list .row:last-child{border-bottom:0}
.list .row:hover{background:var(--card2)}
.rollo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;background:var(--card);border-radius:15px;margin-bottom:8px;box-shadow:var(--sh1);transition:transform .35s var(--spring),box-shadow .3s;cursor:pointer}
.rollo:hover{transform:translateX(-4px) scale(1.01);box-shadow:var(--sh2)}
.rollo .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.rollo b{display:block;overflow-wrap:anywhere}
.rollo .m{font-size:12px;color:var(--muted)}
.rollo .kg{font-weight:800;font-size:17px;text-align:right}
.rollo .kg small{display:block;font-size:11px;color:var(--muted);font-weight:650}
/* ajustes: opciones que se deslizan */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh1);animation:slidein .55s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.opt h4{margin:0 0 10px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:58px;border:0;background:none;padding:0;text-align:center;font-size:11.5px;font-weight:750;color:var(--muted)}
.swatch i{display:block;width:58px;height:42px;border-radius:13px;margin-bottom:5px;box-shadow:inset 0 0 0 1px var(--line),var(--sh1);transition:transform .35s var(--spring),box-shadow .2s;position:relative;overflow:hidden}
.swatch:hover i{transform:translateY(-3px) scale(1.05)}
.swatch.on i{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--acc)}
.swatch.on{color:var(--ink)}
.tabs2{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -22px 14px;padding:0 22px}
.tabs2 button{border:0;background:none;padding:9px 12px;border-radius:12px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tabs2 button.on{background:var(--ink);color:var(--bg)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.setrow:last-child{border:0}
.setrow>div{min-width:0}
.setrow b{display:block;font-size:14px}.setrow span{font-size:12.5px;color:var(--muted)}

/* ---------- paleta Ctrl K ---------- */
.cmd{position:fixed;inset:0;z-index:90;display:grid;place-items:start center;padding-top:12vh;background:rgba(10,11,9,.38);backdrop-filter:blur(4px);animation:fade .2s}
.cmd .box{width:min(660px,calc(100vw - 32px));background:var(--card);border-radius:22px;box-shadow:var(--sh3);overflow:hidden;animation:pop .35s var(--spring)}
@keyframes pop{from{transform:scale(.95) translateY(10px);opacity:0}}
@keyframes fade{from{opacity:0}}
.cmd input{width:100%;border:0;outline:none;background:none;padding:19px 20px;font-size:17px;border-bottom:1px solid var(--line)}
.cmd .res{max-height:52vh;overflow:auto;padding:8px}
.cmd .it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:13px;cursor:pointer;transition:background .15s}
.cmd .it.on,.cmd .it:hover{background:var(--acc-t)}
.cmd .it>div{min-width:0}
.cmd .it b{display:block;font-size:14px}.cmd .it span{font-size:12.5px;color:var(--muted)}
.cmd .it .kg{margin-left:auto;font-weight:800;white-space:nowrap}
.cmd .hint{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.login .art{background:linear-gradient(150deg,#173D28,#0f1a13 70%);color:#EDE3D3;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 20% 30%,rgba(155,227,168,.14),transparent 70%),radial-gradient(600px 400px at 90% 100%,rgba(185,153,121,.16),transparent 70%)}
@keyframes tejer{to{transform:translate(140px,140px)}}
.login .art>*{position:relative}
.login .art h2{font:500 clamp(36px,4.6vw,64px)/1.02 var(--serif);margin:0}
.login .art h2 em{color:#9BE3A8}
.login .art p{color:#B5C2B7;max-width:420px}
.login .pane{display:grid;place-items:center;padding:32px 20px}
.login .box{width:min(400px,100%);animation:rise .7s var(--ease) both}
.login h3{font:500 34px var(--serif);margin:0 0 6px}
.users{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.ucard{border:0;background:var(--card);border-radius:18px;padding:12px;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--sh1);font-weight:750;font-size:13px;transition:transform .35s var(--spring),box-shadow .3s;position:relative;animation:pop .45s var(--spring) both;animation-delay:calc(var(--i,0)*70ms)}
.ucard:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.ucard.on{box-shadow:0 0 0 3px var(--acc)}
.ucard .av{width:46px;height:46px;font-size:18px}
.ucard span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .del{position:absolute;top:4px;right:6px;font-size:14px;color:var(--muted);opacity:0;transition:opacity .2s}
.ucard:hover .del{opacity:1}
.pw{position:relative}
.pw .fld{padding-right:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.eye:hover{background:var(--fill);color:var(--ink)}
.eye svg{transition:transform .35s var(--spring)}
.eye:active svg{transform:scale(.8)}
.lerr{color:var(--crit);font-weight:700;font-size:13.5px;min-height:20px;margin-top:8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- panel: bento ---------- */
.bento{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa button{border:0;background:var(--card2);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-weight:800;font-size:13.5px;text-align:left;transition:transform .4s var(--spring),background .25s,box-shadow .3s;min-height:96px;min-width:0}
.qa button svg{width:26px;height:26px;padding:7px;box-sizing:content-box;border-radius:12px;background:var(--card);color:var(--acc);transition:transform .45s var(--spring),background .25s,color .25s}
.qa button span{font-size:12px;color:var(--muted);font-weight:650;display:block}
.qa button:hover{background:var(--card);transform:translateY(-4px);box-shadow:var(--sh2)}
.qa button:hover svg{transform:rotate(-8deg) scale(1.1);background:var(--acc);color:var(--acc-ink)}
.alerta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 10px;border-radius:14px;transition:background .2s,transform .3s var(--spring)}
.alerta:hover{background:var(--card2);transform:translateX(3px)}
.alerta .ai{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.alerta .ai.r{background:#F5D9D2;color:var(--crit)}.alerta .ai.s{background:#F1E3CF;color:#7B5520}.alerta .ai.g{background:var(--acc-soft);color:var(--acc)}.alerta .ai.n{background:#DCE3F0;color:#1F2A44}
.alerta b{display:block;font-size:13.5px}.alerta span{font-size:12.5px;color:var(--muted)}
/* recorrido animado */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative}
.flow .st{background:var(--card2);border-radius:18px;padding:14px 12px;text-align:left;border:0;position:relative;transition:transform .4s var(--spring),background .2s,box-shadow .3s;min-width:0}
.flow .st:hover{transform:translateY(-5px) scale(1.02);background:var(--card);box-shadow:var(--sh2)}
.flow .st .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--taupe);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .st .v{font-size:clamp(17px,2vw,24px);font-weight:800;margin-top:6px;letter-spacing:-.02em;white-space:nowrap}
.flow .st .v small{font-size:12px;color:var(--muted);font-weight:700}
.flow .st .n{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .st .lvl{height:6px;border-radius:99px;background:var(--fill);margin-top:10px;overflow:hidden}
.flow .st .lvl i{display:block;height:100%;border-radius:99px}
.flow .st:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:12px;height:2px;background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);background-size:6px 2px;animation:fluye .6s linear infinite}
@keyframes fluye{to{background-position:6px 0}}

/* ---------- materia prima: diagrama de procesos ---------- */
.sankey path.fl{fill:none;stroke-linecap:butt;opacity:.85;transition:stroke-width .6s var(--ease),opacity .2s}
.sankey path.fl:hover{opacity:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.sankey path.mv{fill:none;stroke:#fff;stroke-opacity:.55;stroke-dasharray:2 16;animation:corre 1.2s linear infinite}
@keyframes corre{to{stroke-dashoffset:-18}}
.sankey rect.nd{transition:height .6s var(--ease),y .6s var(--ease)}
.sankey text{font:750 12px var(--sans);fill:var(--ink)}
.sankey text.s{font-weight:650;fill:var(--muted);font-size:11px}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.calc .cv{background:var(--card2);border-radius:16px;padding:12px;min-width:0}
.calc .cv b{display:block;font-size:clamp(18px,9cqi,26px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.calc .cv span{font-size:12px;color:var(--muted);font-weight:700}

/* ---------- prendas ---------- */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--gap)}
.mod{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh2);cursor:pointer;min-width:0;container-type:inline-size}
.mod h3{margin:0;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.mod .tl{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:4px;align-items:end;height:74px;margin:14px 0 6px}
.mod .tl div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.mod .tl i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--acc);opacity:.85;transition:transform .35s var(--spring),opacity .2s;transform-origin:bottom}
.mod:hover .tl i{opacity:1}
.mod .tl div:hover i{transform:scaleY(1.08) translateY(-2px);box-shadow:0 6px 10px -4px rgba(0,0,0,.35)}
.mod .tl small{font-size:10.5px;font-weight:800;color:var(--muted)}
.mod .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.mod .tot b{font-size:24px;font-weight:800}

/* ---------- producción ---------- */
.ped{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 12px;border-radius:15px;cursor:pointer;transition:background .2s,transform .35s var(--spring),box-shadow .3s;border-bottom:1px solid var(--line2)}
.ped:hover{background:var(--card);box-shadow:var(--sh2);transform:translateY(-2px)}
.ped>div{min-width:0}
.ped b{display:block}
.steps{display:flex;align-items:center;gap:0}
.steps i{flex:1;height:6px;background:var(--fill);position:relative}
.steps i:first-child{border-radius:99px 0 0 99px}.steps i:last-child{border-radius:0 99px 99px 0}
.steps i>u{position:absolute;inset:0;border-radius:inherit;transform-origin:left;animation:growx 1s var(--ease) both}
.steps em{width:12px;height:12px;border-radius:50%;background:var(--fill2);flex:none;margin:0 -2px;z-index:1;box-shadow:0 0 0 3px var(--card)}
.steps em.on{background:var(--acc)}
.stepl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:750;margin-top:4px}

/* ---------- báscula ---------- */
.scale{background:radial-gradient(520px 240px at 50% 0,#2a2c26,#121311);color:#EDE3D3;border-radius:26px;padding:24px 22px;text-align:center;box-shadow:var(--sh3);position:relative;overflow:hidden}
.scale .w{font-size:clamp(54px,9vw,108px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;color:#fff;transition:color .3s}
.scale .w small{font-size:.32em;color:#B5A88F;margin-left:6px;letter-spacing:0}
.scale .st{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:750;margin-top:10px;color:#B5A88F}
.scale.stable .w{color:#9BE3A8}
.scale.stable::after{content:"";position:absolute;inset:0;border-radius:26px;box-shadow:inset 0 0 0 2px rgba(155,227,168,.55);animation:fade .4s}
.bicon{width:170px;height:130px;margin:0 auto 6px;display:block;overflow:visible}
.bicon .plat{transition:transform .5s var(--spring)}
.bicon .aguja{transform-origin:60px 70px;transition:transform .8s var(--spring)}
.scale.pesando .bicon .plat{animation:rebota .7s var(--ease) infinite alternate}
@keyframes rebota{from{transform:translateY(0)}to{transform:translateY(4px)}}
.scale.pesando .bicon .rollito{animation:cae .7s var(--spring) both}
@keyframes cae{from{transform:translateY(-40px);opacity:0}}
.bicon .ok{opacity:0;transform:scale(.4);transform-origin:96px 18px;transition:opacity .3s,transform .5s var(--spring)}
.scale.stable .bicon .ok{opacity:1;transform:none}
.label-prev{background:#fff;border-radius:15px;padding:14px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;color:#000;font-size:12.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.label-prev b{font-size:15px;overflow-wrap:anywhere}
.label-prev .bc{grid-column:1/-1}
.bc svg{width:100%;height:48px;display:block}

/* ---------- caja estilo Apple ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:var(--gap);align-items:start}
.find{position:relative;z-index:35}
.find .search{min-height:58px;border-radius:18px;font-size:17px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:18px;box-shadow:var(--sh3);z-index:30;max-height:340px;overflow:auto;padding:6px;animation:pop .3s var(--spring)}
.sug button{all:unset;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:13px;cursor:pointer}
.sug button:hover,.sug button.on{background:var(--acc-t)}
.sug b{display:block;font-size:14px}.sug span{font-size:12px;color:var(--muted)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:var(--card);border-radius:18px;box-shadow:var(--sh1);margin-bottom:10px;animation:pop .4s var(--spring) both}
.line>div{min-width:0}
.line .qty{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.qty button{border:0;background:var(--fill);width:34px;height:34px;border-radius:11px;font-size:18px;font-weight:800;transition:transform .25s var(--spring),background .2s}
.qty button:hover{background:var(--fill2)}.qty button:active{transform:scale(.88)}
.qty input{width:84px;text-align:center;font-weight:800;border:1px solid var(--line);border-radius:11px;min-height:34px;background:var(--card)}
.qty .q{white-space:nowrap;border:0;background:var(--card2);border-radius:99px;padding:6px 10px;font-weight:800;font-size:12px;color:var(--muted);transition:background .2s}
.qty .q:hover{background:var(--acc-t);color:var(--acc)}
.sum{position:sticky;top:16px;background:var(--card);border-radius:26px;box-shadow:var(--sh3);padding:22px}
.sum .tot{font-size:clamp(34px,13cqi,52px);font-weight:800;letter-spacing:-.035em;line-height:1}
.pays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.pay{border:0;background:var(--card2);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:800;font-size:12px;transition:transform .35s var(--spring),background .2s,box-shadow .25s,color .2s;min-width:0}
.pay svg{width:28px;height:28px;stroke-width:1.6;transition:transform .45s var(--spring)}
.pay:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.pay:hover svg{transform:scale(1.12) rotate(-6deg)}
.pay.on{background:var(--ink);color:var(--bg);box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.mpqr{text-align:center;padding:10px 0}
.mpqr .q{width:230px;height:230px;margin:10px auto;background:#fff;border-radius:22px;padding:14px;position:relative;box-shadow:var(--sh2)}
.mpqr .q::after{content:"";position:absolute;inset:-8px;border-radius:28px;border:2px solid var(--acc);animation:latido 1.8s var(--ease) infinite}
@keyframes latido{0%{opacity:.8;transform:scale(.96)}100%{opacity:0;transform:scale(1.08)}}
.okcheck{width:96px;height:96px;margin:10px auto;display:block}
.okcheck circle{stroke:var(--ok);stroke-dasharray:300;stroke-dashoffset:300;animation:draw .7s var(--ease) forwards}
.okcheck path{stroke:var(--ok);stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s var(--ease) .55s forwards}

/* ---------- ventas ---------- */
.pulsos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.kpi.pulso{padding-bottom:64px;min-height:180px}
.kpi.pulso .spark{position:absolute;left:18px;right:18px;bottom:12px;width:calc(100% - 36px);height:44px;color:var(--taupe)}
.kpi.pulso.hero .spark{color:#fff}
.kpi.pulso[aria-pressed=true]{box-shadow:0 20px 44px -18px var(--acc)}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mes .dh{font-size:10.5px;font-weight:800;color:var(--taupe);text-align:center;letter-spacing:.1em}
.dia{aspect-ratio:1/.82;border-radius:12px;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:800;background:var(--card2);border:0;text-align:left;transition:transform .35s var(--spring),box-shadow .3s;min-width:0;overflow:hidden;color:var(--ink)}
.dia b{font-size:clamp(9px,1.1vw,12.5px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 12px 20px -10px rgba(0,0,0,.45);z-index:1;position:relative}
.dia.hoy{box-shadow:0 0 0 2px var(--acc)}
.dia.fut{opacity:.4}
.dia.vacio{visibility:hidden}
.hm{border-collapse:separate;border-spacing:3px;width:100%;font-size:11px}
.hm th{color:var(--taupe);font-weight:800;padding:2px 4px}
.hm tbody th{text-align:left}
.hm td{height:24px;border-radius:6px;min-width:20px;transition:transform .25s var(--spring),box-shadow .2s}
.hm td:hover{transform:scale(1.3);box-shadow:0 6px 12px -4px rgba(0,0,0,.45);position:relative;z-index:1}

/* ---------- IA ---------- */
.ia .body{display:flex;flex-direction:column;padding-bottom:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 16px}
.msg{max-width:92%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5;animation:pop .35s var(--spring) both;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);box-shadow:var(--sh1);border-bottom-left-radius:6px;width:92%}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-left:18px}
.msg .paso{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin:2px 0}
.msg .paso i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.msg .paso.err i{background:var(--crit)}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--taupe);animation:bob 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px);opacity:.5}}
.iain{display:flex;gap:8px;padding:12px 0 18px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
.iain textarea{flex:1;min-height:48px;max-height:140px;resize:none}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.sugs button{border:0;background:var(--card);border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:700;text-align:left;box-shadow:var(--sh1);transition:transform .3s var(--spring),box-shadow .2s}
.sugs button:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.iacard{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px}
.iacard .btn{margin-top:8px}

/* ---------- avisos, botones flotantes ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px) scale(.96);background:var(--ink);color:var(--bg);border-radius:15px;padding:12px 16px;font-weight:750;font-size:14px;opacity:0;pointer-events:none;transition:.4s var(--spring);z-index:99;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.iafab{position:fixed;right:22px;bottom:92px;z-index:45;width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--acc),var(--navy));color:#fff;display:grid;place-items:center;box-shadow:0 16px 34px -12px var(--acc);transition:transform .45s var(--spring),border-radius .45s var(--spring)}
.iafab:hover{transform:translateY(-4px) rotate(-6deg);border-radius:50%}
.iafab svg{width:26px;height:26px}
.iafab::after{content:"";position:absolute;inset:-4px;border-radius:22px;border:2px solid var(--acc);opacity:0;animation:latido 2.6s var(--ease) infinite}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,11,9,.45);display:grid;place-items:center;padding:16px;animation:fade .2s;backdrop-filter:blur(3px)}
.sheet{background:var(--bg);border-radius:26px;padding:22px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--sh3);animation:pop .4s var(--spring)}
.skel{background:linear-gradient(90deg,var(--fill) 0,var(--card2) 50%,var(--fill) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.wiz{display:flex;gap:6px;margin-bottom:14px}
.wiz div{flex:1;height:5px;border-radius:99px;background:var(--fill);overflow:hidden}
.wiz div i{display:block;height:100%;background:var(--acc);transition:width .6s var(--ease)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px}
.chk i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;font-weight:900;font-size:12px}
.chk i.ok{background:var(--acc-soft);color:var(--acc)}.chk i.w{background:#F1E3CF;color:#7B5520}.chk i.no{background:#F5D9D2;color:var(--crit)}
.drop{border:2px dashed var(--fill2);border-radius:var(--r);padding:34px 20px;text-align:center;background:var(--card2);transition:border-color .25s,background .25s,transform .35s var(--spring);cursor:pointer;display:block}
.drop:hover,.drop.on{border-color:var(--acc);background:var(--card);transform:scale(1.01)}
.drop svg{width:48px;height:48px;color:var(--acc);margin-bottom:8px;transition:transform .45s var(--spring)}
.drop:hover svg{transform:translateY(-5px)}
.drop b{display:block;font-size:17px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--fill)}
.tl .ev{position:relative;padding:8px 0 14px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:0 0 0 3px var(--fill2)}
.tl .ev.on::before{background:var(--acc);box-shadow:0 0 0 3px var(--acc-t)}
/* presentación TV */
.pres{position:fixed;inset:0;z-index:98;background:var(--bg);padding:3vw 4vw;overflow:hidden;display:flex;flex-direction:column;font-size:clamp(16px,1.3vw,26px)}
.pres .bar{height:4px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:auto}
.pres .bar i{display:block;height:100%;background:var(--acc);animation:prog linear forwards}
@keyframes prog{from{width:0}to{width:100%}}
.pres .slide{flex:1;animation:rise .8s var(--ease) both;display:flex;flex-direction:column;min-height:0}
.pres h1{font:500 clamp(34px,4vw,72px)/1 var(--serif);margin:0 0 2vw}

/* ---------- impresión ---------- */
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;inset:0}}

/* ---------- celular, tableta, TV ---------- */
.tabbar{display:none}
@media (min-width:1900px){html:not([data-escala=compacta]){--fs:17px;--gap:18px}.shell{grid-template-columns:290px minmax(0,1fr)}}
@media (max-width:1280px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.s3{grid-column:span 6}.pos{grid-template-columns:1fr}.sum{position:relative;top:0}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:14px 16px 140px}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:50;background:rgba(21,22,19,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:6px;gap:2px;overflow-x:auto;scrollbar-width:none;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
  .tabbar a,.tabbar button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:18px;color:#CFC3AD;text-decoration:none;font-size:10.5px;font-weight:750;transition:background .25s,color .25s;border:0;background:none}
  .tabbar a.on{background:var(--acc);color:var(--acc-ink)}
  .g3,.g2,.flow{grid-template-columns:1fr 1fr}
  .flow .st:not(:last-child)::after{display:none}
  .toast{bottom:104px}
  .pvwrap,.tblwrap{max-height:none}
  .iafab{bottom:calc(152px + env(safe-area-inset-bottom));right:12px;width:48px;height:48px}
  .login{grid-template-columns:1fr}.login .art{display:none}
  .pulsos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
  .pulsos>.kpi{flex:0 0 80%;scroll-snap-align:center}
  .calc{grid-template-columns:1fr 1fr}
  .s3{grid-column:span 12}
}
@media (max-width:560px){
  .line{grid-template-columns:minmax(0,1fr) auto}.line>.ic{display:none}.line .qty{grid-column:1/-1}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g3,.g2{grid-template-columns:1fr}
  .card,.kpi{padding:14px}
  .hbars .row{grid-template-columns:minmax(0,1fr) auto}
  .hbars .row .track{grid-column:1/-1;order:3}
  .hide-s{display:none!important}
  .ring{flex-direction:column;align-items:stretch}
  .ring svg{align-self:center}
  .pv tr.l1>td:first-child>div{padding-left:22px}.pv tr.l2>td:first-child>div{padding-left:34px}
  .modal{place-items:end stretch;padding:0}.sheet{border-radius:26px 26px 0 0;max-height:92vh}
  .cmd{padding-top:6vh}
  .qa{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pays{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ped{grid-template-columns:minmax(0,1fr) auto}.ped .steps-c{grid-column:1/-1;order:3}
  .top h1{font-size:30px}
  .cal{width:50px}.cal b{font-size:24px}
  .mes{gap:3px}.dia{padding:4px;border-radius:8px}.dia b{font-size:9px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ================= v4: isla de ventas de hoy ================= */
.fab{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;flex-direction:column;align-items:stretch;background:rgba(20,21,18,.92);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);color:#EDE3D3;border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:10px 12px;box-shadow:0 24px 60px -18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);transform:translateY(30px) scale(.9);opacity:0;pointer-events:none;transition:transform .6s var(--spring),opacity .4s,box-shadow .4s,border-radius .5s var(--spring);text-align:left;min-width:300px;max-width:min(380px,calc(100vw - 24px))}
.fab.on{transform:none;opacity:1;pointer-events:auto}
.fab:hover,.fab:focus-visible{box-shadow:0 30px 70px -20px var(--acc),inset 0 1px 0 rgba(255,255,255,.08);border-radius:28px}
.fab .fi{display:flex;align-items:center;gap:12px}
.fab .lv{width:12px;height:12px;border-radius:50%;background:#9BE3A8;position:relative;flex:none;margin-left:4px}
.fab .lv i{position:absolute;inset:-5px;border-radius:50%;border:2px solid #9BE3A8;animation:latido 2.2s var(--ease) infinite}
.fab .fm{display:flex;flex-direction:column;min-width:0;flex:1}
.fab small{font-size:11.5px;color:#B5C2B7;font-weight:750;white-space:nowrap}
.fab .fm b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.fab .fs{width:84px;height:34px;flex:none;color:#9BE3A8}.fab .fs svg{width:100%;height:100%;display:block}
.fab em{font-style:normal;font-weight:800;font-size:12.5px;background:rgba(255,255,255,.08);border-radius:99px;padding:5px 9px;white-space:nowrap}
.fab em.up{color:#9BE3A8}.fab em.down{color:#F2A493}
.fab .fx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--spring),opacity .3s;opacity:0}
.fab .fxi{overflow:hidden;display:flex;flex-direction:column;gap:7px;min-height:0}
.fab:hover .fx,.fab:focus-visible .fx{grid-template-rows:1fr;opacity:1}
.fab .fxi>:first-child{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.fab .fr{display:grid;grid-template-columns:10px minmax(0,1fr) 70px auto;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.fab .fr .sw{width:10px;height:10px}.fab .fr u{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;display:block}.fab .fr u s{display:block;height:100%;border-radius:9px}

/* ---------- v5 final: tendencia ---------- */
.chart .tend path{fill:none;stroke-width:1.25;stroke-dasharray:1.4 3.2;stroke-linecap:round;opacity:.95}
.chart .tend text{font-size:10.5px;font-weight:800;letter-spacing:.02em;opacity:0;transition:opacity .3s}
.chart .tend circle{opacity:.9}
.chart .tclip{transform-box:fill-box;transform-origin:left center;animation:crece 1.6s .5s var(--ease) both}
.chart:hover .tclip{animation:crece2 1.1s var(--ease) both}.chart:hover .tend text{opacity:1;transition-delay:.8s}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes crece2{from{transform:scaleX(0)}to{transform:scaleX(1)}}
html[data-mov=off] .chart .tclip{animation:none}
.legend i.tl{width:18px;height:0;border-top:1.6px dotted #1f4d2e;background:none!important;border-radius:0}
html[data-tema=noche] .chart .tend path,html[data-tema=noche] .chart .tend circle{stroke:#9BE3A8;fill:#9BE3A8}html[data-tema=noche] .chart .tend text{fill:#9BE3A8}html[data-tema=noche] .legend i.tl{border-color:#9BE3A8}
html[data-tema=noche] .chart .tend path{fill:none}

/* ================= v5 final · identidad ROMELL ================= */
:root{--cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--logo:none}

/* nomenclatura en piezas */

.nomen small{font-size:8.5px;letter-spacing:.16em;color:#8FA294;font-weight:700;line-height:1}.nomen b{font-size:14.5px;font-weight:800;letter-spacing:.03em;line-height:1.1;white-space:nowrap}
.nomen>i{font-style:normal;color:#6c7a6f;align-self:center;font-weight:800}
.nomen.xl{padding:6px;border-radius:14px}.nomen.xl b{font-size:22px}.nomen.xl small{font-size:9.5px}.nomen.xl>span{padding:4px 10px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
/* lista de órdenes */
.opl{display:flex;flex-direction:column;gap:6px}
.opr{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--card2);transition:transform .35s var(--spring),box-shadow .3s,background .2s}

.opr.sm{grid-template-columns:minmax(0,1fr) auto}
.opm b{display:block;font-size:14.5px}.opm small{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:650}
.opp{display:flex;gap:4px}.opp i{width:22px;height:5px;border-radius:9px;background:var(--fill2);transition:background .3s}.opp i.on{background:var(--acc)}.opp i.cur{box-shadow:0 0 0 3px var(--acc-t)}

.exh{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.exq{width:92px;height:92px;background:#fff;border-radius:14px;padding:6px;flex:none}.exq svg{width:100%;height:100%}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.bal>div{border:1.6px solid var(--ink);border-radius:14px;padding:10px 12px;min-width:0}.bal>div:first-child{background:#151613;color:#EDE3D3;border-color:#151613}
.bal small{display:block;font:800 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;opacity:.75}.bal b{display:block;font:800 26px/1.05 var(--cond);letter-spacing:.01em}.bal span{font-size:12px;font-weight:700;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

.exs b{display:block;font:800 17px var(--cond);letter-spacing:.02em;text-transform:uppercase}.exs small{display:block;font-size:12.5px;color:var(--muted);font-weight:650}
.exa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.exr{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.exi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card2);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:650;width:100%}.exi:hover{background:var(--acc-t)}
/* nueva orden */
.oln{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 90px auto;gap:8px;align-items:center;margin-top:8px;padding:10px;border-radius:14px;background:var(--card2)}.olp{grid-column:1/-1;overflow-x:auto}

.fmm.bien b{color:#9BE3A8}.fmm.alto b{color:#F2C46B}.fmm.mal b{color:#F2A493}

.clave3 b{display:block;font:800 26px/1 var(--cond)}.clave3 small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}.clave3 i{font-style:normal;font:800 22px var(--cond);color:var(--muted)}
.clave3 .on{background:var(--acc-t);border-color:var(--acc);transform:translateY(-2px)}.clave3 .res{background:#151613;color:#EDE3D3;border-color:#151613}.clave3 .res small{color:#8FA294}

function calcHilo(a) {
  const st = a.mp.filter(m => m.estado === "almacen"), stock = sum(st, m => m.kg), hoy = new Date();
  const sal = a.mp.filter(m => m.salida > 0 && m.fout), ult = sal.filter(m => (hoy - aFecha(m.fout)) / 864e5 <= 45 && m.fout <= ymd(hoy));
  const fs = ult.map(m => m.fout).sort(), dias = fs.length ? Math.max(14, (hoy - aFecha(fs[0])) / 864e5) : 0, diario = dias ? sum(ult, m => m.salida) / dias : 0;

}

function pintarMovsTab() { if (S.mv.tab === "comparar") return pintarMovs(); if (S.mv.tab === "registrar") { pintarMV(); setTimeout(() => $("#mvq")?.focus({ preventScroll: true }), 60); } if (S.mv.tab === "historial") pintarHist(); }

/* ---------- registrar ---------- */

        ${t === "traspaso" ? `<i class="flecha">${ico("enviar")}</i><label><span>Para</span><select class="fld" data-in="mva">${UB.filter(u => u !== MV.de).map(u => `<option value="${u}" ${MV.a === u ? "selected" : ""}>${esc(UBN[u])}</option>`).join("")}</select></label>` : ""}

function formEntrada() {

  <div class="frm4"><label><span>Tela</span><input class="fld" list="dlT" data-in="mvn" data-k="tela" value="${esc(N.tela)}" placeholder="FELPA NACIONAL"></label><label><span>Color</span><input class="fld" list="dlC" data-in="mvn" data-k="color" value="${esc(N.color)}" placeholder="NEGRO"></label>
  <label><span>Lote</span><input class="fld" data-in="mvn" data-k="lote" value="${esc(N.lote)}"></label><label><span>Kg</span><input class="fld num" type="number" step="0.01" min="0" inputmode="decimal" data-in="mvn" data-k="kg" value="${esc(N.kg)}" id="mvkg"></label></div>

}
function pintarMV() {

function pintarSugMV(abrir) {

    ${R.length ? S._mvS.map((r, i) => `<button class="${i ? "" : "on"}" data-act="mv-add" data-c="${esc(r.code)}">${sw(r.color)}<span class="ell"><b>${esc(r.tela)}</b> ${esc(r.color)} <span class="muted">· lote ${esc(r.lote)}${r.n ? " · " + esc(r.n) : ""} · <span class="mono">${esc(fCodigo(r.code))}</span></span></span><b class="num">${fKg2(r.kg)} kg</b></button>`).join("") + (q.length && R.length > 8 ? `<button data-act="mv-addall"><span class="ell"><b>Agregar los ${fN(R.length)} rollos</b> <span class="muted">que coinciden</span></span><b class="num">${fKg(sum(R, r => r.kg))} kg</b></button>` : "")
